<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳一年级 · 阳光学习工作台</title>
<style>
  :root{
    --purple-1:#7B5CD6;
    --purple-2:#9B7BE8;
    --purple-3:#B49BF0;
    --purple-dark:#4A2E8F;
    --purple-bg:#F2EEFB;
    --green-1:#27AE60;
    --green-2:#3DDC84;
    --green-3:#6FE9A8;
    --green-bg:#EAFBF1;
    --amber:#F5A623;
    --danger:#E74C3C;
    --ink:#3A2E5C;
    --ink-2:#7A6FA0;
    --card:#ffffff;
    --line:#E7DFF7;
    --radius:18px;
    --shadow:0 8px 24px rgba(122,92,214,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    background:var(--purple-bg);
    color:var(--ink);
    font-size:15px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}

  /* ===== 顶部 ===== */
  header{
    background:linear-gradient(120deg,#6C4ABF 0%,var(--purple-1) 45%,var(--purple-2) 100%);
    color:#fff;
    padding:14px 22px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 4px 18px rgba(108,74,191,.35);
    position:sticky;top:0;z-index:50;
    flex-wrap:wrap;
  }
  .logo{font-size:22px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
  .logo span{font-size:26px;}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .name-box{background:rgba(255,255,255,.16);border:1px dashed rgba(255,255,255,.55);border-radius:999px;padding:6px 16px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .name-box .edit{font-size:13px;opacity:.9;cursor:pointer;}
  .name-box:hover{background:rgba(255,255,255,.26);}
  .pts-pill{background:linear-gradient(120deg,var(--green-1),var(--green-2));border-radius:999px;padding:6px 16px;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(39,174,96,.45);display:flex;align-items:center;gap:6px;}

  /* ===== 布局 ===== */
  .layout{display:flex;min-height:calc(100vh - 66px);}
  aside{
    width:222px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
    padding:16px 12px 20px;display:flex;flex-direction:column;gap:4px;
    position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;
  }
  .nav-group{font-size:12px;color:var(--ink-2);padding:10px 10px 4px;font-weight:700;letter-spacing:1px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
    color:var(--ink);font-size:15px;font-weight:600;transition:.15s;text-align:left;width:100%;
  }
  .nav-item:hover{background:var(--purple-bg);}
  .nav-item.active{background:linear-gradient(120deg,var(--purple-1),var(--purple-2));color:#fff;box-shadow:0 6px 14px rgba(123,92,214,.35);}
  .nav-item .ico{font-size:20px;width:26px;text-align:center;}
  .nav-item .prog{margin-left:auto;font-size:12px;font-weight:700;opacity:.85;white-space:nowrap;}
  .nav-item.active .prog{opacity:1;}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px;}
  .side-btn{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700;color:var(--purple-dark);background:var(--purple-bg);transition:.15s;justify-content:center;}
  .side-btn:hover{background:#E4DAF7;}
  .side-btn.green{background:var(--green-bg);color:var(--green-1);}
  .side-btn.green:hover{background:#D7F5E4;}

  /* ===== 主区 ===== */
  main{flex:1;padding:22px 26px 60px;min-width:0;}
  .page-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .page-title{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;}
  .page-title .ico{font-size:30px;}
  .book-tag{margin:2px 0 18px;background:var(--purple-bg);color:var(--purple-dark);border:1px solid #DDD0F5;padding:8px 14px;border-radius:12px;font-size:13px;line-height:1.6;}
  .book-tag b{opacity:.85;}

  /* 卡片通用 */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
  .grid{display:grid;gap:16px;}
  .g-home{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
  .g-shop{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}

  .hero{
    background:linear-gradient(120deg,var(--purple-1),var(--purple-2));
    color:#fff;border-radius:22px;padding:26px 28px;box-shadow:var(--shadow);
    margin-bottom:18px;position:relative;overflow:hidden;
  }
  .hero:after{content:"🎈";position:absolute;right:26px;top:14px;font-size:44px;opacity:.5;}
  .hero h1{font-size:24px;margin-bottom:6px;}
  .hero p{opacity:.92;font-size:15px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:18px;}
  .stat{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:4px;}
  .stat .k{font-size:13px;color:var(--ink-2);}
  .stat .v{font-size:28px;font-weight:800;}
  .stat.green .v{color:var(--green-1);}
  .stat.purple .v{color:var(--purple-1);}
  .stat.amber .v{color:var(--amber);}

  h3.sec{margin:22px 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .sec small{font-weight:600;color:var(--ink-2);font-size:13px;}

  /* ===== 打卡 ===== */
  .checkin-card{
    background:linear-gradient(120deg,#fdf6e7,#fef9ef);
    border:2px solid #F7E3B5;border-radius:20px;padding:20px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px;
  }
  .checkin-main{flex:1;min-width:220px;}
  .checkin-main .t{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .checkin-main .d{font-size:13px;color:var(--ink-2);margin-top:4px;}
  .flame{font-size:34px;}
  .btn-checkin{
    background:linear-gradient(120deg,var(--green-1),var(--green-2));color:#fff;
    font-size:18px;font-weight:800;padding:14px 30px;border-radius:999px;
    box-shadow:0 8px 18px rgba(39,174,96,.4);transition:.15s;
  }
  .btn-checkin:hover{transform:translateY(-2px);}
  .btn-checkin.done{background:#C9C4DA;box-shadow:none;cursor:default;}
  .streak-pill{background:#fff;border:2px solid #F7E3B5;border-radius:999px;padding:8px 18px;font-weight:800;color:#B97E0C;display:flex;align-items:center;gap:6px;font-size:15px;}

  /* ===== 任务卡 ===== */
  .unit{margin-bottom:22px;}
  .unit-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .unit-name{font-size:17px;font-weight:800;color:var(--purple-dark);}
  .unit-stat{font-size:13px;font-weight:700;color:var(--ink-2);}
  .bar{flex:1;min-width:120px;height:10px;background:#EEE8FA;border-radius:999px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-1),var(--green-2));border-radius:999px;transition:width .3s;}
  .task{
    display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(122,92,214,.08);
    transition:.15s;cursor:pointer;
  }
  .task:hover{border-color:var(--purple-3);transform:translateX(2px);}
  .task.done{background:var(--green-bg);border-color:#B9EBD0;}
  .box{
    width:28px;height:28px;border-radius:50%;border:3px solid var(--purple-3);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;margin-top:2px;transition:.2s;
  }
  .task.done .box{background:var(--green-1);border-color:var(--green-1);color:#fff;}
  .t-body{flex:1;min-width:0;}
  .t-name{font-size:15px;font-weight:700;}
  .t-desc{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.5;}
  .t-pts{
    flex-shrink:0;background:var(--purple-bg);color:var(--purple-dark);font-weight:800;font-size:13px;
    border-radius:999px;padding:6px 12px;margin-top:2px;
  }
  .task.done .t-pts{background:var(--green-1);color:#fff;}

  /* ===== 家务 ===== */
  .chore{position:relative;}
  .chore .mgmt{flex-shrink:0;display:flex;gap:6px;margin-top:2px;}
  .chore .mgmt button{
    width:32px;height:32px;border-radius:10px;font-size:14px;transition:.15s;
    background:#F0EDF8;color:var(--purple-dark);display:flex;align-items:center;justify-content:center;
  }
  .chore .mgmt button:hover{background:#E4DAF7;}
  .chore .mgmt button.del{color:var(--danger);}
  .chore.done .mgmt button{background:rgba(255,255,255,.75);}
  .chore-ico{font-size:20px;}
  .btn-add-chore{
    border:2px dashed var(--green-3);color:var(--green-1);background:#fff;
    border-radius:16px;padding:14px 18px;margin-top:4px;font-size:15px;font-weight:800;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  }
  .btn-add-chore:hover{background:var(--green-bg);}

  /* ===== 学科概览（首页）===== */
  .sub-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:16px;cursor:pointer;transition:.15s;border:2px solid transparent;}
  .sub-card:hover{border-color:var(--purple-3);transform:translateY(-2px);}
  .sub-card .s-ico{font-size:30px;}
  .sub-card .s-name{font-size:16px;font-weight:800;margin-top:8px;}
  .sub-card .s-prog{font-size:13px;color:var(--ink-2);margin-top:4px;}
  .mini-bar{height:8px;background:#EEE8FA;border-radius:999px;overflow:hidden;margin-top:8px;}
  .mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-1),var(--green-2));}

  /* ===== 商店 ===== */
  .shop-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .big-pts{font-size:20px;font-weight:800;color:var(--green-1);}
  .reward{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;border:2px solid transparent;position:relative;}
  .reward .r-ico{font-size:38px;}
  .reward .r-name{font-size:16px;font-weight:800;line-height:1.35;}
  .reward .r-cost{font-weight:800;color:var(--amber);font-size:15px;}
  .btn-redeem{
    margin-top:auto;background:linear-gradient(120deg,var(--purple-1),var(--purple-2));color:#fff;
    font-weight:800;border-radius:12px;padding:10px;font-size:15px;transition:.15s;
  }
  .btn-redeem:hover{filter:brightness(1.08);}
  .btn-redeem:disabled{background:#D9D4E6;cursor:not-allowed;}
  .reward .del{
    position:absolute;top:8px;right:10px;color:var(--danger);font-size:14px;font-weight:800;
    display:none;background:none;
  }
  .reward.custom:hover .del{display:block;}
  .btn-add-reward{
    border:2px dashed var(--purple-3);color:var(--purple-dark);background:#fff;
    border-radius:18px;min-height:150px;font-size:15px;font-weight:800;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .btn-add-reward:hover{background:var(--purple-bg);}
  .rec-list{list-style:none;}
  .rec-list li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);font-size:14px;}
  .rec-list li:last-child{border-bottom:none;}
  .rec-list .when{margin-left:auto;color:var(--ink-2);font-size:12px;}
  .rec-list .pts-tag{font-weight:800;color:var(--green-1);}
  .rec-list .pts-tag.minus{color:var(--danger);}

  /* ===== 动态 ===== */
  .feed{list-style:none;}
  .feed li{display:flex;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:14px;align-items:baseline;}
  .feed li:last-child{border-bottom:none;}
  .feed .emo{flex-shrink:0;}
  .feed .when{margin-left:auto;color:var(--ink-2);font-size:12px;white-space:nowrap;}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(58,46,92,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;}
  .modal{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:400px;padding:24px;animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{font-size:19px;margin-bottom:14px;color:var(--purple-dark);}
  .modal label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;}
  .modal input[type=text],.modal input[type=number]{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;outline:none;
  }
  .modal input:focus{border-color:var(--purple-2);}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .modal-actions button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:15px;}
  .btn-ok{background:linear-gradient(120deg,var(--purple-1),var(--purple-2));color:#fff;}
  .btn-cancel{background:#F0EDF8;color:var(--ink-2);}

  /* ===== toast ===== */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:120;
    background:var(--purple-dark);color:#fff;padding:13px 26px;border-radius:999px;font-weight:700;font-size:15px;
    box-shadow:0 10px 30px rgba(74,46,143,.4);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-8px);}
  #toast.good{background:linear-gradient(120deg,var(--green-1),var(--green-2));}

  .empty{color:var(--ink-2);padding:30px;text-align:center;}
  .foot-note{margin-top:30px;color:var(--ink-2);font-size:12px;line-height:1.8;border-top:1px dashed var(--line);padding-top:14px;}

  /* ===== 响应式 ===== */
  @media (max-width:760px){
    header{padding:12px 14px;}
    .layout{flex-direction:column;}
    aside{
      width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
      border-right:none;border-bottom:1px solid var(--line);padding:10px;gap:6px;
    }
    .nav-group,.side-foot{display:none;}
    .nav-item{width:auto;padding:8px 12px;font-size:14px;}
    main{padding:16px;}
    .hero{padding:20px;}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>🌈</span> 阳光学习工作台</div>
  <div class="header-right">
    <div class="name-box" id="nameBox" title="点击修改名字">
      <span id="nameText">宝贝</span><span class="edit">✏️</span>
    </div>
    <div class="pts-pill" id="ptsPill">⭐ <span id="ptsNum">0</span> 积分</div>
  </div>
</header>

<div class="layout">
  <aside id="sideNav"></aside>
  <main id="main"></main>
</div>

<div id="modalWrap"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* =========================================================
   深圳小学一年级 · 阳光学习工作台
   教材版本依据（深圳小学一年级上册主要教材）：
   - 语文：统编版（部编版）一年级上册（2024 秋新版）· 人民教育出版社
   - 数学：北师大版一年级上册（2024 新版）· 北京师范大学出版社（深圳主流）
   - 英语：深港朗文版 Primary English 一年级上册（深圳主流；部分学校用沪教牛津版）
   - 科学：粤教粤科版一年级上册（2024 秋版）· 广东教育出版社 / 广东科技出版社
   - 道德与法治：统编版一年级上册（2024 秋新版）· 人民教育出版社
   - 音乐：花城版《走进音乐世界》（艺术·音乐）一年级上册 · 广东教育出版社 / 花城出版社
   - 美术：岭南版《艺术·美术》一年级上册（2024 新版）· 岭南美术出版社
   - 体育：国家课程《体育与健康》一年级课程内容（深圳各校统一，无固定课本）
   - 综合：综合实践活动 / 劳动课程（深圳按国家课程方案开设）
   ========================================================= */

var APP_KEY = "sz_g1_workbench_v1";

/* ---------------- 教材目录数据 ---------------- */
var SUBJECTS = [
  {
    id:"yuwen", name:"语文", icon:"📖", tag:"📚",
    book:"统编版（部编版）语文一年级上册（2024 秋新版）",
    src:"目录依据人民教育出版社统编版 2024 新版教材",
    units:[
      {name:"起始单元 · 我上学了", tasks:[
        {n:"认识新朋友", d:"大胆说出自己的名字，认识 3 位新同学", p:3},
        {n:"学唱《上学歌》", d:"和爸爸妈妈一起唱一唱", p:2},
        {n:"聊聊我的学校", d:"说说学校里有哪些地方，你最喜欢哪里", p:3}
      ]},
      {name:"第一单元 · 识字（1）", tasks:[
        {n:"认读《天地人》", d:"会认“天、地、人”等字，能组词", p:5},
        {n:"背诵《金木水火土》", d:"正确、流利地背诵儿歌", p:5},
        {n:"认识《口耳目手足》", d:"会认“口、耳、目、手、足”并指出身体部位", p:5},
        {n:"认识《日月山川》", d:"会认“日、月、山、川”等象形字", p:5}
      ]},
      {name:"第二单元 · 汉语拼音（一）", tasks:[
        {n:"学习 a o e", d:"会读、会写单韵母 a o e", p:4},
        {n:"学习 i u ü y w", d:"会读 i u ü，认识声母 y w", p:4},
        {n:"学习 b p m f", d:"会拼读 b—a→ba 等音节", p:4},
        {n:"学习 d t n l", d:"会拼读 d t n l 与单韵母组成的音节", p:4}
      ]},
      {name:"第三单元 · 汉语拼音（二）", tasks:[
        {n:"学习 g k h", d:"会拼读 g k h 与单韵母的音节", p:4},
        {n:"学习 j q x", d:"记住 j q x 与 ü 相拼去点规则", p:4},
        {n:"学习 z c s / zh ch sh r", d:"区分平舌音与翘舌音", p:4},
        {n:"认识整体认读音节 y w", d:"会读 yi、wu、yu 等整体认读音节", p:4}
      ]},
      {name:"第四单元 · 汉语拼音（三）", tasks:[
        {n:"学习 ai ei ui", d:"读准复韵母 ai ei ui 及音节", p:4},
        {n:"学习 ao ou iu", d:"读准复韵母 ao ou iu 及音节", p:4},
        {n:"学习 ie üe er", d:"读准 ie üe er，认识特殊韵母 er", p:4},
        {n:"学习前后鼻韵母", d:"区分 an en in un ün 与 ang eng ing ong", p:4}
      ]},
      {name:"第五单元 · 阅读（一）", tasks:[
        {n:"朗读《秋天》", d:"有感情地朗读，认识“秋、气”等生字", p:5},
        {n:"朗读《江南》", d:"读准字音，感受江南之美", p:5},
        {n:"朗读《雪地里的小画家》", d:"背诵喜欢的段落", p:5},
        {n:"朗读《四季》", d:"学做小诗人，仿说一句四季的话", p:5}
      ]},
      {name:"第六单元 · 识字（2）", tasks:[
        {n:"学习《对韵歌》", d:"背诵《对韵歌》，感受对仗之美", p:5},

/* ---------------- 状态 ---------------- */
function freshState(){
  return {
    version:1,
    childName:"宝贝",
    points:0,
    totalEarned:0,
    tasks:{},            // taskKey -> true
    checkins:{},         // 'YYYY-MM-DD' -> true
    streak:0,
    lastCheckin:null,
    rewards:JSON.parse(JSON.stringify(DEFAULT_REWARDS)),
    redeemed:[],         // {name, cost, date}
    history:[],          // {type, text, pts, when}
    custom:0,
    chores:JSON.parse(JSON.stringify(DEFAULT_CHORES)), // 家务列表 [{id,ico,name,pts}]
    choreDone:{},        // choreId -> 'YYYY-MM-DD'（当天完成标记）
    choreCustom:0
  };
}
var state = load();

function load(){
  try{
    var raw = localStorage.getItem(APP_KEY);
    if(!raw) return freshState();
    var s = JSON.parse(raw);
    var f = freshState();
    if(!s || typeof s !== "object") return f;
    // 合并默认值，保证结构完整
    for(var k in f){ if(!(k in s)) s[k] = (k==="rewards") ? JSON.parse(JSON.stringify(DEFAULT_REWARDS)) : f[k]; }
    if(!Array.isArray(s.rewards) || s.rewards.length===0) s.rewards = JSON.parse(JSON.stringify(DEFAULT_REWARDS));
    return s;
  }catch(e){ return freshState(); }
}
function save(){ try{ localStorage.setItem(APP_KEY, JSON.stringify(state)); }catch(e){ toast("保存失败：存储空间不足", false); } }

function todayStr(){
  var d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function ydayStr(t){
  var parts = t.split("-");
  var d = new Date(+parts[0], +parts[1]-1, +parts[2]-1);
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
}
function pad(n){ return n<10 ? "0"+n : ""+n; }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function taskKey(subId, ui, ti){ return subId + ":" + ui + ":" + ti; }
function subOf(subId){ for(var i=0;i<SUBJECTS.length;i++){ if(SUBJECTS[i].id===subId) return SUBJECTS[i]; } return null; }
function subStats(sub){
  var total=0, done=0, pts=0, got=0;
  sub.units.forEach(function(u, ui){
    u.tasks.forEach(function(t, ti){
      total++; pts += t.p;
      if(state.tasks[taskKey(sub.id, ui, ti)]){ done++; got += t.p; }
    });
  });
  return {total:total, done:done, pts:pts, got:got};
}
function greeting(){
  var h = new Date().getHours();
  if(h<6) return "夜深了";
  if(h<12) return "早上好";
  if(h<14) return "中午好";
  if(h<18) return "下午好";
  return "晚上好";
}

/* ---------- 事件绑定 ---------- */
function bindMain(){
  var main = document.getElementById("main");
  main.querySelectorAll("[data-go]").forEach(function(el){
    el.onclick = function(){ currentView = el.getAttribute("data-go"); renderAll(); };
  });
  main.querySelectorAll('[data-task]').forEach(function(el){
    el.onclick = function(){
      var key = el.getAttribute("data-task");
      var pts = +el.getAttribute("data-pts");
      var checked = !state.tasks[key];
      toggleTask(key, pts, checked);
    };
  });
  main.querySelectorAll("[data-act]").forEach(function(el){
    el.onclick = function(){ act(el.getAttribute("data-act")); };
  });
  main.querySelectorAll("[data-redeem]").forEach(function(el){
    el.onclick = function(){ redeem(el.getAttribute("data-redeem")); };
  });
  main.querySelectorAll("[data-del]").forEach(function(el){
    el.onclick = function(ev){ ev.stopPropagation(); removeReward(el.getAttribute("data-del")); };
  });
  main.querySelectorAll("[data-chore]").forEach(function(el){
    el.onclick = function(){ toggleChore(el.getAttribute("data-chore")); };
  });
  main.querySelectorAll("[data-ce]").forEach(function(el){
    el.onclick = function(ev){ ev.stopPropagation(); editChore(el.getAttribute("data-ce")); };
  });
  main.querySelectorAll("[data-cd]").forEach(function(el){
    el.onclick = function(ev){ ev.stopPropagation(); removeChore(el.getAttribute("data-cd")); };
  });
}

/* ---------- 逻辑 ---------- */
function toggleTask(key, pts, checked){
  if(checked){
    if(state.tasks[key]) return;
    state.tasks[key] = true;
    state.points += pts;
    state.totalEarned += pts;
    pushHistory("task", "完成任务，+" + pts + " 分", pts);
    toast("太棒了！+" + pts + " 分 🎉", true);
  }else{
    if(!state.tasks[key]) return;
    delete state.tasks[key];
    state.points = Math.max(0, state.points - pts);
    pushHistory("task", "取消任务，-" + pts + " 分", 0);
    toast("已取消任务，-" + pts + " 分");
  }
  save(); renderAll();
}

function toggleChore(id){
  var c = null;
  state.chores.forEach(function(x){ if(x.id === id) c = x; });
  if(!c) return;
  var t = todayStr();
  if(state.choreDone[id] === t){
    delete state.choreDone[id];
    state.points = Math.max(0, state.points - c.pts);
    pushHistory("chore", "取消家务「" + c.name + "」", 0);
    toast("已取消家务，-" + c.pts + " 分");
  }else{
    state.choreDone[id] = t;
    state.points += c.pts;
    state.totalEarned += c.pts;
    pushHistory("chore", "完成家务「" + c.name + "」，+" + c.pts + " 分", c.pts);
    toast("家务完成！+" + c.pts + " 分 🧹", true);
  }
  save(); renderAll();
}

function choreModal(title, okText, icoVal, nmVal, ptsVal, onOk){
  openModal(title,
    '<label>图标（表情符号）</label><input type="text" id="mIco" maxlength="4" value="' + esc(icoVal) + '">' +
    '<label>家务名称</label><input type="text" id="mName" maxlength="12" value="' + esc(nmVal) + '" placeholder="例如：扫地">' +
    '<label>完成后得几分（1-20）</label><input type="number" id="mPts" min="1" max="20" value="' + (+ptsVal || "") + '">',
    okText, function(){
      var ico = document.getElementById("mIco").value.trim() || "🧹";
      var nm = document.getElementById("mName").value.trim();
      var ps = parseInt(document.getElementById("mPts").value, 10);
      if(!nm){ toast("请填写家务名称"); return; }
      if(isNaN(ps) || ps < 1 || ps > 20){ toast("积分需为 1-20 的数字"); return; }
      onOk({ico:ico.slice(0,4), name:nm, pts:ps});
    });
}

function addChore(){
  choreModal("添加家务", "添加", "🧹", "", "", function(v){
    state.choreCustom++;
    var id = "hc" + state.choreCustom;
    state.chores.push({id:id, ico:v.ico, name:v.name, pts:v.pts});
    pushHistory("other", "添加家务「" + v.name + "」", 0);
    save(); renderAll(); closeModal();
    toast("家务已添加 🧹", true);
  });
}

function editChore(id){
  var c = null;
  state.chores.forEach(function(x){ if(x.id === id) c = x; });
  if(!c) return;
  choreModal("编辑家务", "保存", c.ico, c.name, c.pts, function(v){
    c.ico = v.ico; c.name = v.name; c.pts = v.pts;
    pushHistory("other", "编辑家务「" + c.name + "」", 0);
    save(); renderAll(); closeModal();
    toast("家务已保存 ✏️", true);
  });
}

function removeChore(id){
  var c = null;
  state.chores.forEach(function(x){ if(x.id === id) c = x; });
  if(!c) return;
  if(!confirm("删除家务「" + c.name + "」？")) return;
  state.chores = state.chores.filter(function(x){ return x.id !== id; });
  delete state.choreDone[id];
  save(); renderAll();
  toast("已删除家务");
}

function doCheckin(){
  var t = todayStr();
  if(state.checkins[t]){ toast("今天已经打过卡啦，明天再来！"); return; }
  state.checkins[t] = true;
  var y = ydayStr(t);
  state.streak = (state.lastCheckin === y) ? state.streak + 1 : 1;
  state.lastCheckin = t;
  var gain = 10;
  var bonus = false;
  if(state.streak % 7 === 0){ gain += 20; bonus = true; }
  state.points += gain;
  state.totalEarned += gain;
  pushHistory("checkin", "打卡成功，已连续 " + state.streak + " 天", gain);
  save(); renderAll();
  if(bonus){ toast("连续打卡 " + state.streak + " 天！奖励 +20 分 🎊", true); }
  else{ toast("打卡成功！+10 分，连续 " + state.streak + " 天 🔥", true); }
}

function redeem(id){
  var r = null;
  state.rewards.forEach(function(x){ if(x.id === id) r = x; });
  if(!r) return;
  if(state.points < r.cost){ toast("积分还不够哦，继续加油！"); return; }
  if(!confirm("确定用 " + r.cost + " 分兑换「" + r.name + "」吗？")) return;
  state.points -= r.cost;
  state.redeemed.push({name:r.name, cost:r.cost, date:todayStr()});
  pushHistory("redeem", "兑换「" + r.name + "」", 0);
  save(); renderAll();
  toast("兑换成功！记得找爸爸妈妈兑现哦 🎁", true);
}

function pushHistory(type, text, pts){
  var d = new Date();
  var when = (d.getMonth()+1) + "月" + d.getDate() + "日 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  state.history.push({type:type, text:text, pts:pts, when:when});
  if(state.history.length > 200) state.history = state.history.slice(-200);
}

/* ---------- 名称 / 奖励 ---------- */
function openModal(title, body, okText, onOk){
  var wrap = document.getElementById("modalWrap");
  wrap.innerHTML = '<div class="modal-mask"><div class="modal"><h3>' + esc(title) + '</h3><div class="m-body">' + body + '</div>' +
    '<div class="modal-actions"><button class="btn-cancel" id="mCancel">取消</button><button class="btn-ok" id="mOk">' + esc(okText) + '</button></div></div></div>';
  wrap.querySelector("#mCancel").onclick = function(){ wrap.innerHTML = ""; };
  wrap.querySelector("#mOk").onclick = function(){ onOk(); };
  var inp = wrap.querySelector("input");
  if(inp) setTimeout(function(){ inp.focus(); }, 50);
}
function editName(){
  openModal("修改宝贝名字", '<label>孩子名字</label><input type="text" id="mName" maxlength="12" value="' + esc(state.childName) + '">',
    "保存", function(){
      var v = document.getElementById("mName").value.trim();
      if(!v){ toast("名字不能为空"); return; }
      state.childName = v.slice(0,12);
      pushHistory("other", "修改名字为「" + state.childName + "」", 0);
      save(); renderAll(); closeModal();
      toast("名字改好啦 ✏️", true);
    });
}
function act(name){
  if(name === "checkin") doCheckin();
  else if(name === "export") exportData();
  else if(name === "import") document.getElementById("importFile").click();
  else if(name === "addReward") addReward();
  else if(name === "addChore") addChore();
}
function addReward(){
  openModal("添加奖励",
    '<label>奖励名称</label><input type="text" id="mName" maxlength="20" placeholder="例如：全家去露营">' +
    '<label>需要积分</label><input type="number" id="mCost" min="5" max="9999" placeholder="例如：100">',
    "添加", function(){
      var nm = document.getElementById("mName").value.trim();
      var cs = parseInt(document.getElementById("mCost").value, 10);
      if(!nm){ toast("请填写奖励名称"); return; }
      if(isNaN(cs) || cs < 5){ toast("积分需为 ≥5 的数字"); return; }
      state.custom++;
      var id = "c" + state.custom;
      state.rewards.unshift({id:id, ico:"🌟", name:nm, cost:cs, custom:true});
      pushHistory("other", "添加奖励「" + nm + "」", 0);
      save(); renderAll(); closeModal();
      toast("奖励已添加 🌟", true);
    });
}
function removeReward(id){
  var r = null;
  state.rewards.forEach(function(x){ if(x.id === id) r = x; });
  if(!r || !r.custom) return;
  if(!confirm("删除奖励「" + r.name + "」？")) return;
  state.rewards = state.rewards.filter(function(x){ return x.id !== id; });
  save(); renderAll();
  toast("已删除");
}
function closeModal(){ document.getElementById("modalWrap").innerHTML = ""; }

/* ---------- 导出 / 导入 ---------- */
function exportData(){
  var d = new Date();
  var fn = "学习工作台备份-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fn;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast("备份文件已导出 💾", true);
}
document.getElementById("importFile").addEventListener("change", function(){
  var file = this.files && this.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      if(!obj || typeof obj !== "object" || !("tasks" in obj)) throw new Error("bad");
      if(!confirm("导入将覆盖当前所有数据，确定继续吗？")) return;
      var f2 = freshState();
      for(var k in f2){ if(!(k in obj)) obj[k] = f2[k]; }
      if(!Array.isArray(obj.rewards) || obj.rewards.length===0) obj.rewards = f2.rewards;
      state = obj;
      save(); renderAll();
      toast("导入成功！数据已恢复 ✅", true);
    }catch(e){ toast("导入失败：文件格式不正确"); }
  };
  reader.readAsText(file);
  this.value = "";
});

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg, good){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = good ? "show good" : "show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ""; }, 2200);
}

/* ---------- 启动 ---------- */
document.getElementById("nameBox").onclick = editName;
renderAll();
</script>
</body>
</html>
